<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Newsreader:ital,wght@1,300&display=swap">
  <style>
    body {
      background: #FDFBF7;
      color: #1A1412;
      font-family: 'Inter', sans-serif;
      padding: 40px;
    }
    .headline {
      max-width: 15ch;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.08;
      position: relative;
    }
    .highlight {
      font-family: serif;
      font-style: italic;
      font-weight: 300;
      color: #8C6D58;
    }
    .char-node {
      display: inline;
      transition: opacity 60ms ease-out;
    }
    .cursor-box {
      display: inline-block;
      position: relative;
      width: 0;
      height: 0.88em;
      vertical-align: -0.05em;
      pointer-events: none;
      z-index: 10;
    }
    .cursor-bar {
      position: absolute;
      left: 1px;
      top: 4%;
      bottom: 4%;
      width: 2.5px;
      background: #8C6D58;
      border-radius: 1px;
      box-shadow: 0 0 4px rgba(140, 109, 88, 0.3);
    }
    .word-box {
      display: inline-block;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h2>Refined Animation Test</h2>
  <div id="headline" class="headline" style="border: 1px dashed #ccc; min-height: 200px;"></div>
  <div style="margin-top: 20px;">
    <button id="btn0">Slide 0</button>
    <button id="btn1">Slide 1</button>
    <button id="btn2">Slide 2</button>
    <button id="btnPause">Pause / Resume</button>
  </div>
  <div id="status" style="margin-top: 10px; font-family: monospace;"></div>

  <script>
    const slides = [
      {
        titleStart: 'How do you ',
        titleHighlight: 'scale and structure',
        titleEnd: ' your business with absolute clarity?'
      },
      {
        titleStart: 'Transforming balance sheets into ',
        titleHighlight: 'sustainable engines',
        titleEnd: ' of capital efficiency.'
      },
      {
        titleStart: 'Guiding visionary founders from ',
        titleHighlight: 'ambitious startup',
        titleEnd: ' to enduring enterprise.'
      }
    ];

    const container = document.getElementById('headline');
    const status = document.getElementById('status');

    let currentSlideIdx = 0;
    let animId = null;
    let isPaused = false;
    let pausedAt = null;
    let totalPaused = 0;
    let startTime = null;
    let charNodes = [];
    let cursorEl = null;
    let cadence = 28;

    function buildSlide(slide) {
      container.innerHTML = '';
      charNodes = [];

      function renderSegment(text, isHighlight) {
        const seg = document.createElement('span');
        if (isHighlight) seg.className = 'highlight';

        // Split by space preserving words
        const words = text.split(' ');
        words.forEach((word, wIdx) => {
          if (word.length > 0) {
            const wBox = document.createElement('span');
            wBox.className = 'word-box';
            for (let c of word) {
              const ch = document.createElement('span');
              ch.className = 'char-node';
              ch.style.opacity = '0';
              ch.textContent = c;
              wBox.appendChild(ch);
              charNodes.push(ch);
            }
            seg.appendChild(wBox);
          }

          if (wIdx < words.length - 1) {
            const sp = document.createElement('span');
            sp.className = 'char-node';
            sp.style.opacity = '0';
            sp.textContent = ' ';
            seg.appendChild(sp);
            charNodes.push(sp);
          }
        });

        container.appendChild(seg);
      }

      renderSegment(slide.titleStart, false);
      renderSegment(slide.titleHighlight, true);
      renderSegment(slide.titleEnd, false);

      cursorEl = document.createElement('span');
      cursorEl.className = 'cursor-box';
      const bar = document.createElement('span');
      bar.className = 'cursor-bar';
      cursorEl.appendChild(bar);

      // Place cursor at beginning
      if (charNodes.length > 0) {
        charNodes[0].before(cursorEl);
      }
    }

    function startAnimation(slideIdx) {
      if (animId) cancelAnimationFrame(animId);
      currentSlideIdx = slideIdx;
      isPaused = false;
      pausedAt = null;
      totalPaused = 0;

      const slide = slides[slideIdx];
      buildSlide(slide);

      const totalChars = charNodes.length;
      // Cadence: consistent 26-29ms per character
      cadence = Math.max(25, Math.min(32, 2000 / totalChars));
      startTime = performance.now();
      let lastRevealed = 0;

      function step(now) {
        if (isPaused) return;

        const elapsed = now - startTime - totalPaused;
        const target = Math.min(totalChars, Math.floor(elapsed / cadence));

        if (target > lastRevealed) {
          for (let i = lastRevealed; i < target; i++) {
            charNodes[i].style.opacity = '1';
          }
          lastRevealed = target;

          if (target < totalChars) {
            charNodes[target].before(cursorEl);
          } else {
            charNodes[totalChars - 1].after(cursorEl);
          }
        }

        if (target < totalChars) {
          animId = requestAnimationFrame(step);
          status.textContent = `Typing: ${target}/${totalChars} (${Math.round(elapsed)}ms)`;
        } else {
          status.textContent = `Completed in ${Math.round(elapsed)}ms. Holding cursor...`;
          // Hold then fade cursor
          setTimeout(() => {
            cursorEl.style.transition = 'opacity 600ms cubic-bezier(0.4, 0, 0.2, 1)';
            cursorEl.style.opacity = '0';
            status.textContent += ' Cursor faded.';
          }, 700);
        }
      }

      animId = requestAnimationFrame(step);
    }

    startAnimation(0);

    document.getElementById('btn0').onclick = () => startAnimation(0);
    document.getElementById('btn1').onclick = () => startAnimation(1);
    document.getElementById('btn2').onclick = () => startAnimation(2);

    document.getElementById('btnPause').onclick = () => {
      isPaused = !isPaused;
      if (isPaused) {
        pausedAt = performance.now();
        if (animId) cancelAnimationFrame(animId);
        status.textContent += ' [PAUSED]';
      } else {
        if (pausedAt) {
          totalPaused += performance.now() - pausedAt;
          pausedAt = null;
        }
        function resumeStep(now) {
          if (isPaused) return;
          const totalChars = charNodes.length;
          const elapsed = now - startTime - totalPaused;
          const target = Math.min(totalChars, Math.floor(elapsed / cadence));

          for (let i = 0; i < target; i++) {
            charNodes[i].style.opacity = '1';
          }

          if (target < totalChars) {
            charNodes[target].before(cursorEl);
            animId = requestAnimationFrame(resumeStep);
            status.textContent = `Typing: ${target}/${totalChars}`;
          } else {
            charNodes[totalChars - 1].after(cursorEl);
            setTimeout(() => {
              cursorEl.style.transition = 'opacity 600ms cubic-bezier(0.4, 0, 0.2, 1)';
              cursorEl.style.opacity = '0';
            }, 700);
          }
        }
        animId = requestAnimationFrame(resumeStep);
      }
    };
  </script>
</body>
</html>
